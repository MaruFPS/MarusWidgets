<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="assets/favicon.png">

<header>

  </nav>
</header>
<main class="product-page">
  <h1 class="product-title viewer-title">VIEWER COUNTER</h1>
  <div class="supported-platforms product-platforms">
  <span class="platform-label">Supported Platforms</span>
  <div class="platform-list">
    <div class="platform"><img src="https://i.ibb.co/tpNCQYPK/twitch.png" alt="Twitch"><span>Twitch</span></div>
    <div class="platform"><img src="https://i.ibb.co/WNy6BXns/kick.png" alt="Kick"><span>Kick</span></div>

</div>
  <div class="product-preview viewer-product-preview">

  <div class="product-feature-list viewer-feature-list">

      <span class="code-divider">|</span>
      <button class="code-tab" data-code="code/viewer/fields.txt">FIELDS</button>
      <span class="code-divider">|</span>
      <button class="code-tab" data-code="code/viewer/pogly.txt">FULL POGLY IMPORT</button>
      <button class="copy-code" type="button">COPY</button>
    </div>
    <pre class="code-window"><code>Loading code…</code></pre>
  </section>
</main>
<script src="product.js"></script>
