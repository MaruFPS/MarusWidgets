<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maru Widgets - Chat</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="index.html" class="logo">Maru Widgets</a>
  <nav>
    <a href="features.html">FEATURES</a>
    <a href="privacy.html">PRIVACY</a>
    <a href="tos.html">TOS</a>
  </nav>
</header>
<main class="product-page">
  <h1 class="product-title">CHAT</h1>
  <div class="supported-platforms product-platforms">
  <span class="platform-label">Supported Platforms</span>
  <div class="platform-list">
    <div class="platform"><img src="https://i.ibb.co/tpNCQYPK/twitch.png" alt="Twitch"><span>Twitch</span></div>
    <div class="platform"><img src="https://i.ibb.co/WNy6BXns/kick.png" alt="Kick"><span>Kick</span></div>
    <div class="platform"><img src="https://i.ibb.co/KjxbDCD1/ytv4.png" alt="YouTube"><span>YouTube</span></div>
  </div>
</div>
  <div class="product-preview chat-product-preview">
    <img src="https://i.ibb.co/m5Km5fZ9/Chat-Asset.gif" alt="Multi-Platform Chat preview">
  </div>
  <div class="product-feature-list">
    <div>💬 Multi-Platform Chat</div>
    <div>• &nbsp;Twitch, Kick &amp; YouTube</div>
    <div>• &nbsp;Shared Chat support</div>
    <div>• &nbsp;Official platform badges</div>
    <div class="nested">• &nbsp;7TV cosmetics</div>
    <div class="nested">• &nbsp;Profile pictures</div>
    <div>• &nbsp;Rich chat styling</div>
    <div>• &nbsp;Cloudflare caching</div>
  </div>
  <section class="code-panel" data-code-panel>
    <div class="code-tabs">
      <button class="code-tab active" data-code="code/chat/html.txt">HTML</button>
      <span class="code-divider">|</span>
      <button class="code-tab" data-code="code/chat/css.txt">CSS</button>
      <span class="code-divider">|</span>
      <button class="code-tab" data-code="code/chat/js.txt">JS</button>
      <span class="code-divider">|</span>
      <button class="code-tab" data-code="code/chat/fields.txt">FIELDS</button>
      <button class="copy-code" type="button">COPY</button>
    </div>
    <pre class="code-window"><code>Loading code…</code></pre>
  </section>
</main>
<script src="product.js"></script>
</body>
</html>
