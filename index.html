<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maru Widgets</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">Maru Widgets</a>

        <nav>
            <a href="features.html">FEATURES</a>
            <a href="privacy.html">PRIVACY</a>
            <a href="tos.html">TOS</a>
        </nav>
    </header>

    <section class="hero">

        <h1>Powerful Widgets for Modern Creators</h1>

        <p class="hero-description">
            Multi-platform chat overlays, viewer counters<br>
            and creator tools for OBS and StreamElements
        </p>

        <div class="supported-platforms">

            <span class="platform-label">Supported Platforms</span>

            <div class="platform-list">

                <div class="platform">
                    <img src="https://i.ibb.co/tpNCQYPK/twitch.png" alt="Twitch">
                    <span>Twitch</span>
                </div>

                <div class="platform">
                    <img src="https://i.ibb.co/WNy6BXns/kick.png" alt="Kick">
                    <span>Kick</span>
                </div>

                <div class="platform">
                    <img src="https://i.ibb.co/KjxbDCD1/ytv4.png" alt="YouTube">
                    <span>YouTube</span>
                </div>

            </div>

        </div>

    </section>

    <section class="widgets-section">

        <div class="widgets-heading">
            <h2>widgets</h2>
            <p>🚧 Currently in Development</p>
        </div>

        <div class="widget-tree">

            <div class="tree-center"></div>
            <div class="tree-horizontal"></div>
            <div class="tree-left"></div>
            <div class="tree-right"></div>

            <a class="widget-column viewer-widget widget-link" href="viewer-counter.html">

                <h3>MULTI-PLATFORM<br>LIVE VIEWER COUNT</h3>

                <div class="viewer-placeholder">
                    <img src="https://i.ibb.co/VWmS4sCr/Viewer-Count-Asset.gif" alt="Viewer Count Demo" class="promo-gif">
                </div>

            </a>

            <a class="widget-column chat-widget widget-link" href="chat.html">

                <h3>MULTI-PLATFORM<br>CHAT</h3>

                <div class="chat-placeholder">
                    <img src="https://i.ibb.co/m5Km5fZ9/Chat-Asset.gif" alt="Chat Demo" class="promo-gif">
                </div>

            </a>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
